name: Server Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genesis_test
      CI: true
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Run Server Unit Tests
        run: pnpm --filter server test:unit --coverage

      - name: Run Server Integration Tests
        run: pnpm --filter server test:integration --coverage

      - name: Upload unit test coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && !contains(github.event.pull_request.labels.*.name, 'skip-coverage-check') }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/server/coverage/unit/lcov.info
          flags: server-unit
          fail_ci_if_error: false

      - name: Upload integration test coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && !contains(github.event.pull_request.labels.*.name, 'skip-coverage-check') }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/server/coverage/integration/lcov.info
          flags: server-integration
          fail_ci_if_error: false
