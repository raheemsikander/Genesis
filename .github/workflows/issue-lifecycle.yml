name: Issue Lifecycle Labels

on:
  create:
  pull_request:
    types: [opened, ready_for_review, reopened, closed]

permissions:
  issues: write
  contents: read

jobs:
  sync-labels:
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LIFECYCLE = [
              "planning",
              "ready-for-dev",
              "dev-in-progress",
              "in-review",
              "qa",
              "ready-to-deploy",
            ];

            const branchIssueNumber = (ref) => {
              const match = /^[a-z]+-(\d+)-/.exec(ref ?? "");
              return match ? Number(match[1]) : null;
            };

            const linkedIssueNumbers = (pr) => {
              const numbers = new Set();
              const branchNumber = branchIssueNumber(pr.head.ref);
              if (branchNumber) numbers.add(branchNumber);
              const closingKeywords =
                /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              for (const match of (pr.body ?? "").matchAll(closingKeywords)) {
                numbers.add(Number(match[1]));
              }
              return [...numbers];
            };

            const getIssue = async (issue_number) => {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                });
                return issue.pull_request ? null : issue;
              } catch {
                return null;
              }
            };

            const setLifecycleLabel = async (issue, label) => {
              const current = issue.labels.map((l) =>
                typeof l === "string" ? l : l.name,
              );
              for (const stale of current) {
                if (LIFECYCLE.includes(stale) && stale !== label) {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: issue.number,
                    name: stale,
                  });
                }
              }
              if (label && !current.includes(label)) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: issue.number,
                  labels: [label],
                });
              }
              core.info(`#${issue.number} -> ${label ?? "(no lifecycle label)"}`);
            };

            if (context.eventName === "create") {
              const issueNumber = branchIssueNumber(context.payload.ref);
              if (!issueNumber) return;
              const issue = await getIssue(issueNumber);
              if (issue?.state === "open") {
                await setLifecycleLabel(issue, "dev-in-progress");
              }
              return;
            }

            const pr = context.payload.pull_request;
            const action = context.payload.action;

            if (action === "closed" && pr.merged && pr.base.ref === "main") {
              const readyIssues = await github.paginate(
                github.rest.issues.listForRepo,
                { ...context.repo, state: "open", labels: "ready-to-deploy" },
              );
              for (const issue of readyIssues) {
                if (issue.pull_request) continue;
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `Released to main via #${pr.number}.`,
                });
                await setLifecycleLabel(issue, null);
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            for (const issueNumber of linkedIssueNumbers(pr)) {
              const issue = await getIssue(issueNumber);
              if (!issue) continue;

              if (action === "closed") {
                if (!pr.merged || pr.base.ref !== "develop") continue;
                /**
                 * develop is the default branch, so GitHub auto-closes issues
                 * referenced with closing keywords on merge. Reopen them:
                 * closure happens at release time, when develop merges to main.
                 * Unconditional (idempotent) so it can't race the auto-close.
                 */
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: "open",
                });
                await setLifecycleLabel(issue, "ready-to-deploy");
              } else if (issue.state === "open") {
                await setLifecycleLabel(
                  issue,
                  pr.draft ? "dev-in-progress" : "in-review",
                );
              }
            }
