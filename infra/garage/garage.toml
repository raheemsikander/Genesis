# Single-node Garage for local dev and integration tests. Never used in a
# deployed environment (those use Cloudflare R2). The secrets below are fixed
# local-only values, like the Postgres and Redis passwords in the compose files.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "9474ca824119124b7f8cd1fcf64e9ef75fda25547fbd3686fff48cbf9b074cc2"

[s3_api]
# Garage rejects any other signing region, so this must match S3_REGION.
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "local-admin-token"
