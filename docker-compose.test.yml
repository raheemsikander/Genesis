services:
  test-db:
    image: postgres:16-alpine
    ports:
      # Slot-0 default 5434 avoids the dev DB on 5433; other sandbox slots
      # offset by slot * 100 via pnpm infra:test:up.
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: genesis_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

